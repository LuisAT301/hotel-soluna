# =====================================================================
# Hotel Soluna: Nginx como proxy inverso, terminación HTTPS y balanceador
# =====================================================================

server_tokens off;   # no revela la versión de Nginx

# DNS interno de Docker. Con "resolve", Nginx vuelve a consultar cada 10 s
# qué contenedores responden al nombre "api": si se agregan réplicas
# (docker compose up -d --scale api=5) o se reinicia una, las encuentra sin
# reiniciar Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_soluna {
    zone api_soluna 64k;                                  # requerido por "resolve"
    server api:8000 resolve max_fails=1 fail_timeout=10s; # todas las réplicas, por turnos
    keepalive 16;
}

# Límite contra adivinar contraseñas: 10 intentos de inicio de sesión
# por minuto desde una misma dirección IP (con 5 de margen).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# ---------------------------------------------------------------------
# Puerto 80: todo se redirige a HTTPS
# ---------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Lo consulta el healthcheck de Docker
    location = /salud-nginx {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# Puerto 443: HTTPS
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/soluna.crt;
    ssl_certificate_key /etc/nginx/certs/soluna.key;
    ssl_protocols       TLSv1.2 TLSv1.3;   # RNF-09: TLS 1.2 o superior
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 1m;

    # Interfaz web (archivos estáticos)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/cabeceras_seguridad.conf;
        # Solo se ejecuta código y estilos servidos por el propio hotel
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Inicio de sesión: con límite de solicitudes
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_api.conf;
    }

    # Resto de la API (incluida la documentación en /api/docs)
    location /api/ {
        include /etc/nginx/proxy_api.conf;
    }
}
