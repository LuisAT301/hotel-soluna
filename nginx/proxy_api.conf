# Reenvío de solicitudes a las réplicas de la API
proxy_pass http://api_soluna;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 2s;
proxy_read_timeout 30s;

# Si una réplica está caída o no responde, Nginx reintenta en otra.
# (Por seguridad, Nginx no repite automáticamente un POST que ya llegó a la API.)
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 3;

include /etc/nginx/cabeceras_seguridad.conf;
