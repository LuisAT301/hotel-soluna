# Cabeceras de seguridad que se agregan a todas las respuestas.
# (En Nginx, un add_header dentro de un location anula los del server,
#  por eso se incluyen en cada location desde este archivo.)
# nosniff: el navegador respeta el tipo de archivo declarado (no ejecuta texto como script).
add_header X-Content-Type-Options "nosniff" always;
# DENY: nadie puede mostrar el sitio dentro de un marco ajeno (evita el clickjacking).
add_header X-Frame-Options "DENY" always;
# Al salir hacia otro sitio solo se informa el dominio, no la página visitada.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# El sitio no usa cámara, micrófono ni ubicación: se bloquean.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# En producción, con un certificado real, se activaría también HSTS:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
