# Cabeceras de seguridad que se agregan a todas las respuestas.
# (En Nginx, un add_header dentro de un location anula los del server,
#  por eso se incluyen en cada location desde este archivo.)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# En producción, con un certificado real, se activaría también HSTS:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
