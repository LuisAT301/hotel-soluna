# =====================================================================
# Hotel Soluna: prototipo en Docker Compose
# Bloque 2: Nginx (HTTPS y balanceo) + 3 réplicas de la API + PostgreSQL.
# Bloque 3: simulador de servicios externos (pasarela, Hacienda, OTA) + Mailpit.
# En los siguientes bloques se agregan los respaldos, el nodo de contingencia
# y la prueba de carga.
#
# Uso:  cp .env.example .env   (y cambiar los valores)
#       docker compose up --build -d
# Abrir: https://localhost
# =====================================================================
name: hotel-soluna

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_admin_password
      - db_app_password
      - db_respaldo_password
    volumes:
      - db_datos:/var/lib/postgresql/data          # datos persistentes
      - ./db/init:/docker-entrypoint-initdb.d:ro   # esquema, catálogo y usuarios de BD
    networks:
      - datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Sin "ports": la base no se publica fuera de Docker

  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_NAME: hotel
      DB_USER: app_hotel
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DEMO_PASSWORD_FILE: /run/secrets/demo_password
      SERVICIOS_LLAVE_FILE: /run/secrets/servicios_llave
      OTA_SECRETO_FILE: /run/secrets/ota_secreto
      SIMULADOR_URL: http://simulador:8000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    secrets:
      - db_app_password
      - jwt_secret
      - demo_password
      - servicios_llave
      - ota_secreto
    depends_on:
      db:
        condition: service_healthy
    networks:
      - datos
      - backend
    # Tres copias idénticas de la API; Nginx reparte las solicitudes entre ellas.
    # Para escalar: docker compose up -d --scale api=5
    deploy:
      replicas: 3
    # Sin "ports": a la API solo se llega a través de Nginx
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "80:80"     # redirige a HTTPS
      - "443:443"   # único punto de entrada al sistema
    volumes:
      - ./web:/usr/share/nginx/html:ro   # interfaz web
      - certificados:/etc/nginx/certs    # certificado autofirmado (se crea al primer arranque)
    depends_on:
      api:
        condition: service_healthy
      simulador:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/salud-nginx || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Simulador de los proveedores externos: pasarela de pago, Hacienda y OTA.
  # Guarda su estado en memoria, por eso hay una sola copia.
  # Panel para la demostración: http://localhost:8090/docs (solo en el propio equipo).
  # Desde Internet solo se llega a /pasarela/tokens, a través de Nginx.
  simulador:
    build: ./simulador
    environment:
      API_URL: http://api:8000
      SERVICIOS_LLAVE_FILE: /run/secrets/servicios_llave
      OTA_SECRETO_FILE: /run/secrets/ota_secreto
    secrets:
      - servicios_llave
      - ota_secreto
    networks:
      - backend
    ports:
      - "127.0.0.1:8090:8000"
    restart: unless-stopped

  # Servidor de correo de prueba: recibe todos los correos que envía la API
  # y los muestra en http://localhost:8025 sin entregarlos a nadie.
  mailpit:
    image: axllent/mailpit:v1.32
    environment:
      MP_MAX_MESSAGES: "1000"
    networks:
      - backend
    ports:
      - "127.0.0.1:8025:8025"   # bandeja web, solo en el propio equipo
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Visor web de la base de datos, SOLO para desarrollo.
  # No arranca con "docker compose up -d": se enciende a pedido con
  #   docker compose up -d adminer      y se abre en http://localhost:8081
  # Solo escucha en el propio equipo (127.0.0.1), nunca en la red.
  adminer:
    image: adminer:6
    profiles: ["herramientas"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - datos
      - herramientas
    ports:
      - "127.0.0.1:8081:8080"
    restart: "no"

networks:
  # Red interna: sin salida a Internet ni acceso desde el equipo anfitrión.
  # Solo la API y PostgreSQL están en ella.
  datos:
    internal: true
  # Red entre Nginx, la API, el simulador de servicios externos y Mailpit
  backend: {}
  # Red para publicar herramientas de desarrollo (Adminer) en el propio equipo
  herramientas: {}

volumes:
  db_datos: {}
  certificados: {}

# Los secretos se toman del archivo .env (que no se sube al repositorio)
# y llegan a cada contenedor como archivos en /run/secrets/
secrets:
  db_admin_password:
    environment: POSTGRES_PASSWORD
  db_app_password:
    environment: DB_APP_PASSWORD
  db_respaldo_password:
    environment: DB_RESPALDO_PASSWORD
  jwt_secret:
    environment: JWT_SECRET
  demo_password:
    environment: DEMO_PASSWORD
  servicios_llave:
    environment: SERVICIOS_LLAVE
  ota_secreto:
    environment: OTA_SECRETO
